apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        ports:
        - containerPort: 8000
        volumeMounts:
        - mountPath: /data
          name: chroma-storage
      volumes:
      - name: chroma-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
spec:
  selector:
    app: chromadb
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-storage
      volumes:
      - name: ollama-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccd-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccd-web
  template:
    metadata:
      labels:
        app: ccd-web
    spec:
      containers:
      - name: web
        image: ccd-microservice-project-web:k8s
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: OLLAMA_HOST
          value: "http://ollama:11434"
        - name: CHROMA_HOST
          value: "http://chromadb:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: ccd-web
spec:
  selector:
    app: ccd-web
  ports:
  - port: 3000
    targetPort: 3000
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccd-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccd-frontend
  template:
    metadata:
      labels:
        app: ccd-frontend
    spec:
      containers:
      - name: frontend
        image: ccd-microservice-project-frontend:k8s
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ccd-frontend
spec:
  selector:
    app: ccd-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort
