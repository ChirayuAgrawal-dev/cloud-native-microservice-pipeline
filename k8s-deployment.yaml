apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  PORT: "3000"
  OLLAMA_HOST: "http://ollama-service:11434"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccd-app-deployment
  labels:
    app: ccd-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ccd-microservice
  template:
    metadata:
      labels:
        app: ccd-microservice
    spec:
      containers:
      - name: app-container
        image: chirayu27/ccd-microservice:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ccd-app-service
spec:
  type: ClusterIP
  selector:
    app: ccd-microservice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000